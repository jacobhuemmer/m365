name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  winget:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: JacobHuemmer.m365
          installers-regex: '_windows_.*\.zip$'
          max-versions-to-keep: 5
          fork-user: jacobhuemmer
          token: ${{ secrets.WINGET_TOKEN }}
